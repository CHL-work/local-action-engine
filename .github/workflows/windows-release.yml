name: Windows demo release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Windows Mono Player
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require Unity activation credentials
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" || ( -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ) ]]; then
            echo '::error::Configure UNITY_EMAIL, UNITY_PASSWORD, and either UNITY_LICENSE or UNITY_SERIAL. See docs/windows-ci.md. No build or release was produced.'
            exit 1
          fi
      - name: Build the existing Unity demo for Windows x64
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: unity
          unityVersion: 6000.3.26f1
          # unityci/editor:ubuntu-6000.3.26f1-windows-mono-3, verified 2026-11-06
          customImage: unityci/editor@sha256:fa196dadbe6f2496beffb8ee3997b9f34e3238579732ee763671a18131784657
          targetPlatform: StandaloneWindows64
          buildMethod: Brainwash.Editor.SandboxBuild.BuildWindows
          versioning: None
      - name: Upload complete Player for Windows execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-player
          path: unity/Builds/Windows/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve Unity build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-build-logs
          path: |
            unity/Logs/
            build.log
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Execute demo on Windows and package
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-player
          path: unity/Builds/Windows
      - name: Run all demo scenarios using compiled fixture directives
        shell: pwsh
        run: ./scripts/test-windows-demo.ps1 -SoftwareRendering
      - name: Package the complete demo and public runtime files
        shell: pwsh
        env:
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $packageVersion = if ($env:SOURCE_REF_TYPE -eq 'tag') { $env:SOURCE_REF_NAME } else { 'dev-' + $env:SOURCE_COMMIT.Substring(0, 12) }
          python scripts/package-windows.py --version $packageVersion --commit $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Release packaging failed.' }
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-demo-release
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve runtime report, screenshots, and Player log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-demo-smoke
          path: .local/ci/windows-smoke/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Create draft GitHub release
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-demo-release
          path: dist
      - name: Create draft with immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          Windows x64 demo built from this tag and exercised on a Windows runner.

          Download and extract the complete ZIP, then follow README.md and run Setup Demo.cmd before Play Demo.cmd. Setup installs the local inference environment and retrieves the separately versioned, hash-verified model assets. Model weights are not embedded in the demo ZIP.

          The CI smoke suite uses compiled fixture directives. It verifies the demo world and action executor, not microphone recognition or model quality. Live inference requires the documented NVIDIA GPU and runtime prerequisites.

          The adjacent SHA-256 file verifies the ZIP; the manifest records every packaged file and the exact source commit. CI logs, scenario reports, and screenshots are available in the workflow run artifacts.
          NOTES
          gh release create "$RELEASE_TAG" dist/* --repo "$GH_REPO" --verify-tag --draft --title "Local Action Engine $RELEASE_TAG" --notes-file release-notes.md
