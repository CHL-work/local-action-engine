name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test contracts, service, and worker boundaries without models
        run: npm test
      - name: Test runtime setup without downloads or models
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Test WAV input validation
        run: python -m unittest discover -s prototype -p "test_*.py" -v
      - name: Test archived trainer controls without training
        run: python -m unittest discover -s research/training -p "test_*.py" -v
      - name: Test the release packaging boundary
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath . -Recurse -Filter '*.ps1' -File |
            Where-Object { $_.FullName -notmatch '[\\/](\.git|\.local|node_modules)[\\/]' }
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "$($file.FullName): $($parseErrors -join '; ')" }
          }
